name: Mirror laboratory releases to GitVerse
on:
  workflow_run:
    workflows: ['Publish laboratory releases']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-labs-to-gitverse
  cancel-in-progress: false
jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check GitVerse connection
        shell: bash
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "::error::Add an Actions repository secret named GITVERSE_TOKEN, then rerun this workflow."
            exit 1
          fi
      - name: Check out the exact source commit and release tags
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "$SOURCE_SHA"
      - name: Copy seven releases, upload 49 files, and verify their hashes
        run: python3 releases/mirror-gitverse.py
